<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percha</title>
<style>
/* Fonts: Inter + emoji fallback */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --canvas:#EAE4D6;
  --canvas-deep:#DCD5C1;
  --paper:#F6F2E8;
  --ink:#2A2721;
  --ink-soft:#5A5548;
  --tan:#8B6F47;
  --tan-deep:#6E5636;
  --sage:#5C6E4F;
  --sage-bg:#E3E8DB;
  --dust:#47617A;
  --dust-bg:#DDE5EA;
  --grey:#8F8570;
  --grey-bg:#E5E0D3;
  --rust:#A8492E;
  --rust-deep:#8A3A22;
}

*{box-sizing:border-box;}
body, #percha-root{
  margin:0; padding:0;
  font-family: 'Inter', system-ui, -apple-system, "Segoe UI", "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background:var(--canvas);
  color:var(--ink);
}
#percha-root{ max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:88px; position:relative; }

.p-header{
  padding:12px 12px;
  display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--canvas-deep); background:var(--paper);
  position:sticky; top:0; z-index:30;
}
.header-left, .header-right{ display:flex; align-items:center; gap:10px; }
.header-center{ flex:1; text-align:center; }
.wordmark{ font-family:'Fraunces',serif; font-weight:700; font-size:20px; letter-spacing:1.5px; text-transform:uppercase; }
.tagline{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); text-transform:uppercase; }

/* small icon button */
.icon-btn{ width:36px; height:36px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; border:none; background:transparent; cursor:pointer; color:var(--ink); }
.icon-btn:active{ transform:translateY(1px); }

/* views */
.p-view{ display:none; padding:16px; }
.p-view.active{ display:block; }

/* tag card */
.tag-card{ position:relative; background:var(--paper); border:2px dashed var(--tan); border-radius:8px; padding:12px; margin-top:12px; }
.tag-hole{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:14px; height:14px; background:var(--canvas); border:2px dashed var(--tan); border-radius:50%;}

/* grid */
.garment-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
.garment-card{ padding-top:6px; position:relative; }
.garment-img-wrap{ width:100%; aspect-ratio:1/1; border-radius:6px; overflow:hidden; background:var(--canvas-deep); position:relative; }
.garment-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.garment-name{ font-weight:600; font-size:14px; margin-top:8px; }
.garment-cat{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); text-transform:uppercase; margin-top:4px; }

/* status button */
.status-btn{ width:100%; border:none; border-radius:20px; padding:6px 8px; font-size:11px; font-weight:600; cursor:pointer; margin-top:8px; }
.status-disponible{ background:var(--sage-bg); color:var(--sage); }
.status-lavando{ background:var(--dust-bg); color:var(--dust); }
.status-no_quiero{ background:var(--grey-bg); color:var(--grey); }

.delete-btn{ position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; border:none; background:var(--paper); color:var(--ink-soft); cursor:pointer; box-shadow:0 0 0 1px var(--canvas-deep); }

/* filters and controls */
.filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
.filter-chip{ flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 12px; border-radius:20px; border:1px solid var(--tan); background:transparent; color:var(--ink); cursor:pointer; text-transform:uppercase; }
.filter-chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.armario-controls{ display:flex; gap:8px; align-items:center; margin:10px 0; }

/* selection */
.select-checkbox{ position:absolute; top:8px; left:8px; width:20px; height:20px; z-index:12; display:none; transform:scale(1.05); }

/* outfits */
.outfits-row{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
.outfit-card{ background:var(--paper); border:2px dashed var(--tan); border-radius:8px; padding:8px; display:flex; gap:8px; align-items:center; }
.outfit-thumb{ width:52px; height:52px; border-radius:6px; overflow:hidden; background:var(--canvas-deep); }
.outfit-name{ font-size:13px; font-weight:600; }

/* lazy "load more" */
.load-more{ width:100%; margin-top:12px; padding:10px; border-radius:8px; border:1px dashed var(--tan); background:transparent; cursor:pointer; }

/* suggestion and misc */
.cta-btn{ width:100%; padding:14px; border:none; border-radius:8px; background:var(--ink); color:var(--paper); font-family:'Fraunces',serif; font-weight:600; font-size:16px; cursor:pointer; }
.secondary-btn{ padding:10px 12px; border-radius:8px; background:transparent; border:1.5px solid var(--tan); color:var(--ink); cursor:pointer; }

/* empty-state with svg */
.empty-state{ text-align:center; padding:36px 16px; color:var(--ink-soft); }
.empty-state .em-svg{ width:48px; height:48px; margin:0 auto 8px; display:block; }

/* modal */
.p-modal-bg{ display:none; position:fixed; inset:0; background:rgba(42,39,33,0.55); z-index:80; align-items:flex-end; justify-content:center; }
.p-modal-bg.active{ display:flex; }
.p-modal{ background:var(--paper); width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:18px; max-height:88vh; overflow-y:auto; }
.p-modal h3{ font-family:'Fraunces',serif; font-size:18px; margin:0 0 12px; }
.field-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); text-transform:uppercase; margin-top:10px; display:block; }
.p-modal input[type=text], .p-modal select, .p-modal textarea{ width:100%; padding:10px; border-radius:8px; border:1.5px solid var(--canvas-deep); background:var(--canvas); font-size:14px; }

/* small helpers */
.reasoning-box{ background:var(--paper); border-left:3px solid var(--rust); padding:12px; margin-top:12px; border-radius:6px; font-size:13px; color:var(--ink); }

/* responsive */
@media(max-width:520px){ .garment-grid{ grid-template-columns:1fr 1fr; } .p-header{ padding:10px; } }
</style>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2A2721">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('SW register failed', e));
}
</script>
</head>
<body>

<script>
/*
  percha - versión con:
  - IndexedDB (blobs para imágenes)
  - lazy-loading + paginación
  - settings modal (API key + usar IA)
  - heurística local usando color bucket
  - SVGs en UI
  - back button + history handling
*/

(async function(){
  // ---- state ----
  const PAGE_SIZE = 40;
  let garments = [];
  let outfits = [];
  let log = {};
  let currentFilter = 'todas';
  let selectMode = false;
  const selectionSet = new Set();
  const imageObjectUrls = {}; // id -> objectURL
  let visibleCount = PAGE_SIZE; // for pagination
  let observer = null; // IntersectionObserver for lazy load
  let useAi = false;
  let aiApiKey = null;

  const CAT_LABELS = { top:'Parte de arriba', bottom:'Parte de abajo', dress:'Vestido / mono', outerwear:'Abrigo / chaqueta', shoes:'Calzado', accessory:'Accesorio' };
  const STATUS_ORDER = ['disponible','lavando','no_quiero'];
  const STATUS_LABELS = { disponible:'Disponible', lavando:'Lavando', no_quiero:'No me la quiero poner' };

  // ---- IndexedDB storage wrapper (kv) ----
  (function(){
    const DB_NAME = 'percha-db';
    const DB_VERSION = 1;
    const STORE = 'kv';
    let dbPromise = null;
    function openDB(){
      if(dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject)=>{
        const rq = indexedDB.open(DB_NAME, DB_VERSION);
        rq.onupgradeneeded = (ev)=>{
          const db = ev.target.result;
          if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath:'key' });
        };
        rq.onsuccess = ()=> resolve(rq.result);
        rq.onerror = ()=> reject(rq.error);
      });
      return dbPromise;
    }
    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readonly');
        const store = tx.objectStore(STORE);
        const req = store.get(key);
        req.onsuccess = ()=> resolve(req.result ? req.result.value : null);
        req.onerror = ()=> reject(req.error);
      });
    }
    async function idbSet(key, value){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        const store = tx.objectStore(STORE);
        const req = store.put({ key, value });
        req.onsuccess = ()=> resolve(true);
        req.onerror = ()=> reject(req.error);
      });
    }
    async function idbDelete(key){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        const store = tx.objectStore(STORE);
        const req = store.delete(key);
        req.onsuccess = ()=> resolve(true);
        req.onerror = ()=> reject(req.error);
      });
    }
    async function idbList(prefix){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readonly');
        const store = tx.objectStore(STORE);
        const out = [];
        const req = store.openCursor();
        req.onsuccess = (e)=>{
          const cur = e.target.result;
          if(!cur){ resolve(out); return; }
          try{ if(typeof cur.key === 'string' && cur.key.indexOf(prefix)===0) out.push(cur.key); }catch(e){}
          cur.continue();
        };
        req.onerror = ()=> reject(req.error);
      });
    }
    function dataUrlToBlob(dataUrl){
      const m = dataUrl.match(/^data:(.+);base64,(.*)$/);
      if(!m) return null;
      const mime = m[1], b64 = m[2];
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }
    async function migrateLocalStorageToIndexedDB(){
      try{
        if(typeof localStorage === 'undefined') return;
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && (k.indexOf('garment:')===0 || k.indexOf('outfit:')===0 || k==='outfit-log' || k==='ai-api-key' || k==='use-ai')) keys.push(k);
        }
        if(keys.length===0) return;
        for(const k of keys){
          const v = localStorage.getItem(k);
          if(v===null) continue;
          try{
            if(k.indexOf('garment:')===0){
              const obj = JSON.parse(v);
              const id = obj.id || k.split(':')[1];
              if(obj.image && typeof obj.image === 'string' && obj.image.indexOf('data:')===0){
                const blob = dataUrlToBlob(obj.image);
                if(blob) await idbSet('image:'+id, blob);
                delete obj.image;
                await idbSet(k, JSON.stringify(obj));
                continue;
              }
            }
            await idbSet(k, v);
          }catch(e){
            try{ await idbSet(k, v); }catch(e){}
          }
        }
      }catch(e){ console.warn('migration error', e); }
    }
    window.storage = {
      get: async (key)=> { try{ return await idbGet(key); }catch(e){ return null; } },
      set: async (key, value)=> { try{ await idbSet(key, value); }catch(e){} },
      delete: async (key)=> { try{ await idbDelete(key); }catch(e){} },
      list: async (prefix)=> { try{ return await idbList(prefix); }catch(e){ return []; } },
      _init: async ()=> { await openDB(); await migrateLocalStorageToIndexedDB(); }
    };
    openDB().then(()=>migrateLocalStorageToIndexedDB()).catch(()=>{/*silent*/});
  })();

  // ---- helpers ----
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

  // compute color bucket from dataURL (small canvas)
  async function colorBucketFromDataUrl(dataUrl){
    return new Promise((resolve)=>{
      try{
        const img = new Image();
        img.onload = ()=>{
          const w = 40, h = 40;
          const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          // draw scaled center-cropped
          const ar = img.width / img.height;
          let sx=0, sy=0, sw=img.width, sh=img.height;
          if(ar > 1){ // wide
            sh = img.height; sw = img.height * (img.width/img.height); sx = (img.width - img.height)/2;
          } else {
            sw = img.width; sh = img.width * (img.height/img.width); sy = (img.height - img.width)/2;
          }
          try{ ctx.drawImage(img, 0, 0, w, h); }catch(e){ ctx.drawImage(img,0,0,w,h); }
          try{
            const id = ctx.getImageData(0,0,w,h).data;
            let r=0,g=0,b=0,cnt=0;
            for(let i=0;i<id.length;i+=4){
              const alpha = id[i+3];
              if(alpha<128) continue;
              r+=id[i]; g+=id[i+1]; b+=id[i+2]; cnt++;
            }
            if(cnt===0) return resolve('grey');
            r=Math.round(r/cnt); g=Math.round(g/cnt); b=Math.round(b/cnt);
            // to HSL
            const rn=r/255, gn=g/255, bn=b/255;
            const max = Math.max(rn,gn,bn), min = Math.min(rn,gn,bn);
            const l = (max+min)/2;
            const d = max - min;
            let s = 0, h = 0;
            if(d!==0){
              s = d / (1 - Math.abs(2*l - 1));
              switch(max){
                case rn: h = ((gn - bn)/d) % 6; break;
                case gn: h = (bn - rn)/d + 2; break;
                case bn: h = (rn - gn)/d + 4; break;
              }
              h = Math.round(h * 60);
              if(h<0) h+=360;
            }
            // classifications
            if(l < 0.12) return resolve('black');
            if(l > 0.88) return resolve('white');
            if(s < 0.12) return resolve('grey');
            if(h >= 0 && h < 15) return resolve('red');
            if(h >= 15 && h < 45) return resolve('orange');
            if(h >= 45 && h < 65) return resolve('yellow');
            if(h >= 65 && h < 170) return resolve('green');
            if(h >= 170 && h < 260) return resolve('blue');
            if(h >= 260 && h < 300) return resolve('purple');
            return resolve('pink');
          }catch(e){ resolve('grey'); }
        };
        img.onerror = ()=> resolve('grey');
        img.src = dataUrl;
      }catch(e){ resolve('grey'); }
    });
  }

  // lazy image loader (IntersectionObserver)
  function initLazyLoader(){
    if(observer) return;
    observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          const img = entry.target;
          const src = img.getAttribute('data-src');
          if(src){
            img.src = src;
            img.removeAttribute('data-src');
            observer.unobserve(img);
          }
        }
      });
    }, { rootMargin: '200px', threshold: 0.01 });
  }
  function observeLazy(imgEl){
    if(!observer) initLazyLoader();
    if(imgEl.getAttribute('data-src')) observer.observe(imgEl);
  }

  // ---- storage helpers ----
  async function storageGet(k){ try{ return await window.storage.get(k); }catch(e){ return null; } }
  async function storageSet(k,v){ try{ await window.storage.set(k,v); }catch(e){} }
  async function storageDelete(k){ try{ await window.storage.delete(k); }catch(e){} }
  async function storageList(p){ try{ return await window.storage.list(p); }catch(e){ return []; } }

  // ---- load / save garments and blobs ----
  async function loadGarments(){
    const keys = await storageList('garment:');
    const out = [];
    for(const k of keys){
      try{
        const raw = await storageGet(k);
        if(!raw) continue;
        const meta = (typeof raw === 'string') ? JSON.parse(raw) : raw;
        const id = meta.id || k.split(':')[1];
        const g = Object.assign({}, meta); g.id = id;
        const blob = await storageGet('image:'+id);
        if(blob && (blob instanceof Blob || Object.prototype.toString.call(blob) === '[object Blob]')){
          const url = URL.createObjectURL(blob);
          imageObjectUrls[id] = url;
          g.image = url;
        } else {
          g.image = meta.image || '';
        }
        out.push(g);
      }catch(e){}
    }
    out.sort((a,b)=> (a.addedAt||0) - (b.addedAt||0));
    return out;
  }

  async function saveGarment(g){
    // store metadata (without image data url)
    const id = g.id;
    const meta = Object.assign({}, g);
    delete meta.image;
    await storageSet('garment:'+id, JSON.stringify(meta));
    // if g._pendingDataUrl exists, convert to blob and store
    if(g._pendingDataUrl){
      const blob = (function(d){ const m = d.match(/^data:(.+);base64,(.*)$/); if(!m) return null; const mime=m[1],b64=m[2]; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], { type: mime }); })(g._pendingDataUrl);
      if(blob){
        await storageSet('image:'+id, blob);
        if(imageObjectUrls[id]) { try{ URL.revokeObjectURL(imageObjectUrls[id]); }catch(e){} delete imageObjectUrls[id]; }
        imageObjectUrls[id] = URL.createObjectURL(blob);
      }
      delete g._pendingDataUrl;
    }
  }

  async function deleteGarmentStorage(id){
    if(imageObjectUrls[id]){ try{ URL.revokeObjectURL(imageObjectUrls[id]); }catch(e){} delete imageObjectUrls[id]; }
    await storageDelete('garment:'+id);
    await storageDelete('image:'+id);
  }

  // ---- outfits ----
  async function loadOutfits(){
    const keys = await storageList('outfit:');
    const out = [];
    for(const k of keys){
      try{
        const raw = await storageGet(k);
        if(!raw) continue;
        out.push(typeof raw === 'string' ? JSON.parse(raw) : raw);
      }catch(e){}
    }
    out.sort((a,b)=> (a.createdAt||0) - (b.createdAt||0));
    return out;
  }
  async function saveOutfit(o){ await storageSet('outfit:'+o.id, JSON.stringify(o)); }
  async function deleteOutfitStorage(id){ await storageDelete('outfit:'+id); }

  async function loadLog(){ const v = await storageGet('outfit-log'); if(!v) return {}; try{ return JSON.parse(v); }catch(e){ return {}; } }
  async function saveLog(){ await storageSet('outfit-log', JSON.stringify(log)); }

    const grid = document.getElementById('armarioGrid');
    const list = getFilteredGarments();
    if(list.length===0){

      renderPaginationControls();

      const dataSrc = g.image ? g.image : '';
      const placeholder = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"></svg>';
      return `<div class="tag-card garment-card" data-id="${g.id}">
        <div class="tag-hole"></div>

        <button class="delete-btn" data-del="${g.id}" title="Eliminar">×</button>

        <div class="garment-name">${escapeHtml(g.name)}</div>
        <div class="garment-cat">${escapeHtml(CAT_LABELS[g.category]||g.category)}</div>
        <button class="status-btn status-${g.status}" data-cycle="${g.id}">${escapeHtml(STATUS_LABELS[g.status])}</button>
      </div>`;
    }).join('') + '</div>';
    // wire events
    grid.querySelectorAll('.select-checkbox').forEach(cb=>{
      cb.addEventListener('change', (e)=>{
        const id = e.currentTarget.getAttribute('data-id');
        if(e.currentTarget.checked) selectionSet.add(id); else selectionSet.delete(id);
        updateSelectionUI();
      });
    });
    grid.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-del');
        if(!confirm('¿Eliminar esta prenda?')) return;
        garments = garments.filter(g=>g.id!==id);
        await deleteGarmentStorage(id);
        // cleanup outfits
        outfits = outfits.map(o=>({ ...o, garmentIds: o.garmentIds.filter(i=>i!==id) })).filter(o=>o.garmentIds.length>0);
        for(const o of outfits) await saveOutfit(o);
        renderArmario();
      });
    });
    grid.querySelectorAll('[data-cycle]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-cycle');
        const g = garments.find(x=>x.id===id);
        if(!g) return;
        const idx = STATUS_ORDER.indexOf(g.status);
        g.status = STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
        await saveGarment(g);
        await storageSet('garment:'+g.id, JSON.stringify(Object.assign({}, g, { image: undefined })));
        renderArmario();
      });
    });
    // observe images for lazy load
    document.querySelectorAll('img[data-src]').forEach(img=> observeLazy(img));
    renderOutfits();
    renderPaginationControls();
    updateSelectionUI();
  }

  // ---- modals / back handling ----

  // push/pop history state so hardware back works
  function pushBackStateIfNeeded(enter){
    try{
      if(enter){
        history.pushState({ percha: 'sub' }, '');
        document.getElementById('backBtn').style.display = 'inline-flex';
      } else {
        // remove pushed states (no-op here; popstate will handle)
        if(history.state && history.state.percha==='sub') history.back();
        document.getElementById('backBtn').style.display = anyModalOpen() || selectMode ? 'inline-flex' : 'none';
      }
    }catch(e){}
  }

  window.addEventListener('popstate', (e)=>{
    // close modal or exit select mode if open
    if(document.getElementById('modalBg').classList.contains('active')) { closeModal(); return; }
    if(document.getElementById('outfitModalBg').classList.contains('active')) { closeOutfitModal(); return; }
    if(document.getElementById('settingsModalBg').classList.contains('active')) { closeSettings(); return; }
    if(selectMode){ selectMode=false; selectionSet.clear(); renderArmario(); return; }
    // otherwise default behavior
  });

    g._pendingDataUrl = window._pendingImageDataUrl;
    garments.push(g);

    pushBackStateIfNeeded(true);
  });
  function closeSettings(){ settingsModalBg.classList.remove('active'); document.getElementById('backBtn').style.display = (selectMode || anyModalOpen()) ? 'inline-flex' : 'none'; }
  document.getElementById('cancelSettings').addEventListener('click', ()=> closeSettings());
  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    aiApiKey = document.getElementById('aiApiKey').value.trim() || null;
    useAi = !!document.getElementById('useAiChk').checked;
    await storageSet('ai-api-key', aiApiKey || '');
    await storageSet('use-ai', useAi ? '1' : '0');
    closeSettings();
    alert('Ajustes guardados');
  });

  // ---- suggestion: improved local heuristic + optional AI call ----
  function wornThisWeekIds(){
    const ids = new Set();
    Object.keys(log).forEach(date=>{
      const d = new Date(date+'T12:00:00');
      const monday = (function getMonday(d0){ d0=new Date(d0); const day=d0.getDay(); const diff=(day===0?-6:1-day); d0.setDate(d0.getDate()+diff); d0.setHours(0,0,0,0); return d0; })(new Date());
      const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
      if(d>=monday && d<=sunday) (log[date]||[]).forEach(id=>ids.add(id));
    });
    return ids;
  }
  function daysSinceWorn(id){
    const dates = Object.keys(log).filter(d=> (log[d]||[]).includes(id));
    if(dates.length===0) return 9999;
    const last = dates.sort().reverse()[0];
    const diff = Math.floor((new Date() - new Date(last+'T12:00:00'))/(1000*60*60*24));
    return diff;
  }

  // score two garments for color compatibility
  function colorCompatibilityScore(a,b){
    if(!a || !b) return 0;
    const neutral = ['grey','black','white','brown'];
    if(a.colorBucket===b.colorBucket) return 3;
    if(neutral.includes(a.colorBucket) || neutral.includes(b.colorBucket)) return 2;
    // some similar pairs: red-orange, blue-purple etc.
    const sim = {
      red:['orange','pink'],
      orange:['red','brown','yellow'],
      yellow:['orange','green'],
      green:['blue','yellow'],
      blue:['green','purple'],
      purple:['blue','pink'],
      pink:['red','purple']
    };
    if(sim[a.colorBucket] && sim[a.colorBucket].includes(b.colorBucket)) return 2;
    return 0;
  }

  async function localSuggest(avoidCombo){
    const resultEl = document.getElementById('suggestionResult');
    const candidates = garments.filter(g=> g.status==='disponible' && !wornThisWeekIds().has(g.id));
    if(candidates.length===0){ resultEl.innerHTML = `<div class="empty-state"><svg class="em-svg" viewBox="0 0 24 24"><path d="M3 7h18v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor"></path></svg><p>No hay prendas disponibles sin usar esta semana.</p></div>`; return; }
    // group by category
    const byCat = {};
    candidates.forEach(c=>{ byCat[c.category]=byCat[c.category]||[]; byCat[c.category].push(c); });
    const pick = (arr)=> arr && arr.length ? arr.slice().sort((a,b)=> daysSinceWorn(a.id) - daysSinceWorn(b.id))[0] : null;
    let chosen = [];
    if(byCat['dress'] && byCat['dress'].length){ chosen.push(pick(byCat['dress'])); const shoe = pick(byCat['shoes']||byCat['shoe']||[]); if(shoe) chosen.push(shoe); }
    else {
      // build candidate pairs and score by color compatibility + recency
      const tops = byCat['top']||[];
      const bottoms = byCat['bottom']||[];
      const shoes = byCat['shoes']||byCat['shoe']||[];
      let bestPair = null; let bestScore=-999;
      if(tops.length && bottoms.length){
        for(const t of tops) for(const b of bottoms){
          const cscore = colorCompatibilityScore(t,b);
          const recencyPenalty = Math.min(7, Math.min(daysSinceWorn(t.id), daysSinceWorn(b.id)));
          const score = cscore*3 + recencyPenalty*0.1;
          if(score > bestScore){ bestScore=score; bestPair=[t,b]; }
        }
      }
      if(bestPair) chosen.push(...bestPair);
      if(chosen.length===0 && tops.length) chosen.push(pick(tops));
      if(chosen.length<2 && bottoms.length) chosen.push(pick(bottoms));
      if(shoes.length) chosen.push(pick(shoes));
    }
    // dedupe and filter
    chosen = Array.from(new Set(chosen.filter(Boolean)));
    if(chosen.length===0) chosen.push(candidates[0]);
    lastCandidates = candidates;
    const chosenIndices = chosen.map(ci=> lastCandidates.indexOf(ci)+1 ).filter(n=>n>0);
    const reasoning = `Sugerencia local: prioricé prendas no usadas recientemente y que combinan por color (${chosen.map(x=>x.name).join(', ')}).`;
    renderSuggestion({ chosen: chosenIndices, reasoning, source:'local' });
  }

  // ---- AI request wrapper (if enabled) ----
  async function requestSuggestion(avoidCombo){
    const resultEl = document.getElementById('suggestionResult');
    // prepare candidates (filtered)
    const candidates = garments.filter(g=> g.status==='disponible' && !wornThisWeekIds().has(g.id));
    if(candidates.length < 1){ resultEl.innerHTML = `<div class="empty-state"><svg class="em-svg" viewBox="0 0 24 24"><path d="M12 2l2 4 4 .5-3 3 .7 4L12 13l-3.7 1.5.7-4-3-3L10 6z" fill="none" stroke="currentColor"/></svg><p>No tienes suficientes prendas disponibles.</p></div>`; return; }
    document.getElementById('suggestBtn').disabled = true;
    document.getElementById('suggestionResult').innerHTML = `<div style="padding:18px;text-align:center;"><div style="width:34px;height:34px;border:3px dashed var(--tan);border-radius:50%;margin:0 auto 8px;animation:spin 1.2s linear infinite"></div><div style="font-size:12px;color:var(--ink-soft)">Mirando tu armario…</div></div>`;
    // if AI disabled or no key -> local
    if(!useAi || !aiApiKey){ await localSuggest(avoidCombo); document.getElementById('suggestBtn').disabled=false; return; }
    // Build content with base64 images (limit to first N to avoid huge payload)
    const contentBlocks = [{ type:'text', text: 'Eres un estilista personal. A continuación enumero las prendas disponibles.' }];
    const maxAttach = 8;
    for(let i=0;i<Math.min(candidates.length, maxAttach); i++){
      const g = candidates[i];
      contentBlocks.push({ type:'text', text: `Prenda ${i+1}: categoria "${CAT_LABELS[g.category]||g.category}", nombre "${g.name}".` });
      try{
        let payload = null;
        if(g.image && g.image.indexOf('data:')===0) payload = (function(d){ const m = d.match(/^data:(.+);base64,(.*)$/); if(!m) return null; return { media_type:m[1], data:m[2] }; })(g.image);
        else if(g.image){
          const resp = await fetch(g.image);
          const blob = await resp.blob();
          payload = await blobToBase64(blob);
        }
        if(payload) contentBlocks.push({ type:'image', source:{ type:'base64', media_type: payload.media_type, data: payload.data } });
      }catch(e){}
    }
    contentBlocks.push({ type:'text', text: 'Responde SOLO con JSON exacto: {"chosen":[números], "reasoning":"explicación en español"}' });
    try{
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-api-key': aiApiKey },
        body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:800, messages:[{ role:'user', content: contentBlocks }] })
      });
      if(!resp.ok) throw new Error('AI error');
      const data = await resp.json();
      const text = (data.content||[]).map(b=>b.text||'').join('');
      const clean = text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);
      parsed.source = 'ai';
      lastCandidates = candidates;
      renderSuggestion(parsed);
    }catch(err){
      console.warn('AI failed, fallback local',err);
      await localSuggest(avoidCombo);
    }finally{ document.getElementById('suggestBtn').disabled=false; }
  }

  // ---- render suggestion result ----
  let lastCandidates = [];
  function renderSuggestion(parsed){
    const resultEl = document.getElementById('suggestionResult');
    const chosenGarments = (parsed.chosen||[]).map(n=> lastCandidates[n-1]).filter(Boolean);
    if(chosenGarments.length===0){ resultEl.innerHTML = `<div style="padding:12px;" class="error-box">No se pudo generar una combinación.</div>`; return; }
    const sourceLabel = parsed.source === 'ai' ? 'Fuente: IA' : (parsed.source === 'local' ? 'Fuente: local' : 'Fuente: desconocida');
    resultEl.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">${escapeHtml(sourceLabel)}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;">
        ${chosenGarments.map(g=>`<div style="background:var(--paper);border:2px dashed var(--tan);border-radius:8px;padding:6px;"><img src="${g.image||''}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;"><div style="font-size:12px;font-weight:600;margin-top:6px;">${escapeHtml(g.name)}</div></div>`).join('')}
      </div>
      <div class="reasoning-box"><strong style="display:block;font-family:IBM Plex Mono,monospace;font-size:10px;color:var(--rust);text-transform:uppercase;margin-bottom:6px;">Por qué combinan</strong>${escapeHtml(parsed.reasoning||'')}</div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="cta-btn" id="logOutfitBtn">Me lo pongo hoy</button>
        <button class="secondary-btn" id="retryBtn">Probar otra</button>
      </div>`;
    document.getElementById('logOutfitBtn').addEventListener('click', async ()=>{
      const date = todayStr();
      const ids = chosenGarments.map(g=>g.id);
      log[date] = Array.from(new Set([...(log[date]||[]), ...ids]));
      await saveLog();
      renderHistorial();
      resultEl.innerHTML = `<div class="reasoning-box"><strong style="display:block;font-family:IBM Plex Mono,monospace;font-size:10px;color:var(--rust);text-transform:uppercase;margin-bottom:6px;">Registrado</strong>Anotado en tu historial. ¡Que lo disfrutes!</div>`;
    });
    document.getElementById('retryBtn').addEventListener('click', ()=> requestSuggestion(parsed.chosen||null));
  }

  // ---- event wiring: tabs/filters/select ----
  document.querySelectorAll('.p-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.p-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.p-view').forEach(v=>v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('view-'+tab.getAttribute('data-tab')).classList.add('active');
    });
  });
  document.getElementById('filterRow').addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.getAttribute('data-filter');
    visibleCount = PAGE_SIZE;
    renderArmario();
  });

  document.getElementById('selectModeBtn').addEventListener('click', ()=>{
    selectMode = !selectMode;
    if(selectMode) pushBackStateIfNeeded(true); else { selectionSet.clear(); }
    renderArmario();
  });

  // ---- lazy load init ----
  initLazyLoader();

  // ---- suggestion button ----
  document.getElementById('suggestBtn').addEventListener('click', ()=> requestSuggestion(null));

  // ---- settings load ----
  async function loadSettings(){
    const k = await storageGet('ai-api-key'); aiApiKey = k || null;
    const u = await storageGet('use-ai'); useAi = (u === '1');
  }

  // ---- file compression helper ----
  function fileToCompressedDataUrl(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> {
        const img = new Image();
        img.onload = ()=>{
          const maxW = 640;
          const scale = Math.min(1, maxW/img.width);
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---- init app: storage init + load data ----
  await (window.storage && window.storage._init ? window.storage._init() : Promise.resolve());
  await loadSettings();
  garments = await loadGarments();
  outfits = await loadOutfits();
  log = await loadLog();
  // set images for garments that have object URLs
  garments.forEach(g=>{ if(imageObjectUrls[g.id]) g.image = imageObjectUrls[g.id]; else if(!g.image) g.image=''; });
  // init visible count
  visibleCount = PAGE_SIZE;
  renderArmario();
  renderHistorial();

  // ---- wire load more visible when scrolling near bottom (optional) ----
  // (we already have button)

  // ---- restore back button state visibility on load ----
  document.getElementById('backBtn').style.display = (selectMode || anyModalOpen()) ? 'inline-flex' : 'none';

  // ---- API export/import helpers (optional) ----
  async function exportAll(){
    // export metadata + images as base64 (heavy for many images) - optional; not wired to UI now
    const data = { garments: [], outfits, log };
    for(const g of garments){
      const meta = Object.assign({}, g);
      delete meta.image;
      const blob = await storageGet('image:'+g.id);
      if(blob){
        const b64 = await new Promise((res)=>{ const r=new FileReader(); r.onloadend=()=>res(r.result); r.readAsDataURL(blob); });
        meta.imageDataUrl = b64;
      }
      data.garments.push(meta);
    }
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='percha-export.json'; a.click(); URL.revokeObjectURL(url);
  }

  // ---- end ----

})();
</script>
