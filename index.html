<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percha</title>
<style>
/* Estilos (remodelados) - mantengo la estética previa */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --bg:#F4F0E9;
  --card:#FFFFFF;
  --muted:#6B6558;
  --accent:#A8492E;
  --accent-deep:#7A3220;
  --canvas-deep:#E0D6C9;
  --success:#5C8B5A;
  --glass: rgba(255,255,255,0.7);
  --shadow: 0 8px 20px rgba(26,20,12,0.06);
}
*{box-sizing:border-box;}
body, #percha-root{ margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,"Segoe UI","Noto Color Emoji","Apple Color Emoji",sans-serif; background:var(--bg); color:#201A14; }
#percha-root{ max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:96px; }

/* Cabecera */
.p-header{ position:sticky; top:0; z-index:60; background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7)); backdrop-filter: blur(6px); border-bottom:1px solid var(--canvas-deep); padding:10px 12px; display:flex; align-items:center; gap:10px; }
.header-left,.header-right{ display:flex; gap:8px; align-items:center; }
.header-center{ flex:1; text-align:center; }
.wordmark{ font-family:'Fraunces',serif; font-weight:700; font-size:18px; letter-spacing:1.5px; text-transform:uppercase; color:#2C2219; }
.tagline{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); text-transform:uppercase; }

/* Icon button */
.icon-btn{ width:36px;height:36px;border-radius:9px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#2C2219; }
.icon-btn:active{ transform:translateY(1px); }

/* Views */
.p-view{ display:none; padding:14px; }
.p-view.active{ display:block; }

/* Controls */
.filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
.filter-chip{ flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:8px 12px; border-radius:20px; border:1px solid var(--canvas-deep); background:transparent; color:#2C2219; cursor:pointer; text-transform:uppercase; }
.filter-chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:var(--shadow); }

/* Armario controls */
.armario-controls{ display:flex; gap:8px; align-items:center; margin-bottom:12px; justify-content:space-between; }
.selection-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* Grid and cards */
.garment-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
.tag-card{ background:var(--card); border-radius:12px; padding:10px; box-shadow:var(--shadow); position:relative; border:1px solid var(--canvas-deep); }
.tag-hole{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:16px; height:16px; background:var(--bg); border-radius:50%; border:2px dashed #C9B79E; }

.garment-img-wrap{ width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:linear-gradient(180deg,#f6f2ea,#efe9dd); display:flex; align-items:center; justify-content:center; }
.garment-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.garment-name{ font-weight:600; font-size:14px; margin-top:10px; color:#231815; }
.garment-cat{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-top:6px; text-transform:uppercase; }
.occasion-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 8px;border-radius:999px;background:#fff3f0;color:var(--accent-deep);border:1px solid #f1d6cf;margin-top:6px}

/* top-right icons */
.icon-top-right{ position:absolute; top:8px; right:8px; display:flex; gap:6px; }
.fav-btn{ width:34px;height:34px;border-radius:8px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#E3B0A1; }
.fav-btn.active{ color:var(--accent-deep); transform:scale(1.05); }
.delete-btn{ width:34px;height:34px;border-radius:8px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted); }
.edit-btn{ width:34px;height:34px;border-radius:8px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted); }

/* status */
.status-btn{ margin-top:8px;border-radius:20px;padding:8px 10px;border:none;font-weight:700;font-size:12px;cursor:pointer; }
.status-disponible{ background:rgba(92,139,90,0.12); color:var(--success); }
.status-lavando{ background:rgba(71,97,122,0.08); color:#47617A; }
.status-no_quiero{ background:rgba(143,133,112,0.08); color:var(--muted); }

/* suggestion */
.cta-btn{ width:100%; padding:14px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));color:#fff;font-weight:700;font-size:16px;cursor:pointer; box-shadow:0 8px 18px rgba(168,73,46,0.18); }

/* empty */
.empty-state{ text-align:center; padding:30px 12px; color:var(--muted); }
.empty-state svg{ width:64px;height:64px; margin-bottom:12px; opacity:0.95; }

/* modal */
.p-modal-bg{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:center; justify-content:center; padding:12px; }
.p-modal-bg.active{ display:flex; }
.p-modal{ width:100%; max-width:420px; border-radius:12px; background:var(--card); padding:16px; box-shadow:var(--shadow); }
.field-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--muted); margin-top:10px; display:block; }
.p-modal input[type=text], .p-modal select, .p-modal textarea{ width:100%; padding:10px; border-radius:8px; border:1px solid var(--canvas-deep); background:var(--bg); margin-top:6px; }

/* outfits (draggable list) */
.outfits-row{ display:flex; gap:8px; align-items:center; margin-bottom:12px; overflow:auto; padding-bottom:8px; }
.outfit-card{ background:var(--card); border-radius:10px; padding:8px; display:flex; align-items:center; gap:8px; border:1px solid var(--canvas-deep); box-shadow:var(--shadow); }
.outfit-thumb{ width:56px;height:56px;border-radius:8px; overflow:hidden; background:linear-gradient(180deg,#f6f2ea,#efe9dd); }

/* infinite sentinel */
.sentinel{ height:1px; width:100%; }

/* footer tabbar */
.p-tabbar{ position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--canvas-deep); display:flex; justify-content:space-around; padding:8px 12px; z-index:80; }
.p-tab{ background:transparent;border:none;cursor:pointer;font-weight:700;color:var(--muted); font-size:12px; display:flex;flex-direction:column; align-items:center; gap:4px; }

/* small helpers */
.reasoning-box{ margin-top:12px; background:linear-gradient(90deg,#fff7f5,#fffaf6); padding:12px;border-radius:8px; border-left:3px solid var(--accent); color:#2b1f18; font-size:13px; }

@media(max-width:520px){ .garment-grid{ grid-template-columns: repeat(2,1fr); } }
</style>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2A2721">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('SW register failed', e));
}
</script>
</head>
<body>
<div id="percha-root">
  <div class="p-header">
    <div class="header-left">
      <button id="backBtn" class="icon-btn" title="Atrás" style="display:none;">

      </button>
    </div>
    <div class="header-center">
      <div class="wordmark">Percha</div>

    </div>
    <div class="header-right">

      </button>
    </div>
  </div>

  <!-- HOY -->
  <div class="p-view active" id="view-hoy">
    <button class="cta-btn" id="suggestBtn">¿Qué me pongo hoy?</button>

  <!-- ARMARIO -->

      <button class="filter-chip" data-filter="favoritos">Favoritos</button>

      <button class="filter-chip" data-filter="lavando">Lavando</button>
      <button class="filter-chip" data-filter="no_quiero">No usar</button>
    </div>

    <div class="armario-controls">
      <div style="display:flex;gap:8px;">
        <button id="selectModeBtn" class="secondary-btn">Seleccionar</button>
        <button id="createOutfitBtnSmall" class="secondary-btn">Crear conjunto</button>

    </div>

    <div class="outfits-row" id="outfitsSection"></div>

  <!-- Floating add -->

    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>

  <!-- TABBAR -->
  <div class="p-tabbar">
    <button class="p-tab active" data-tab="hoy" id="tab-hoy"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2 4 4 .5-3 3 .7 4L12 13l-3.7 1.5.7-4-3-3L10 6z" fill="currentColor"/></svg><div>Hoy</div></button>
    <button class="p-tab" data-tab="armario" id="tab-armario"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 7h18v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2" fill="currentColor"/></svg><div>Armario</div></button>
    <button class="p-tab" data-tab="historial" id="tab-historial"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><div>Historial</div></button>

  <!-- MODAL: añadir/editar prenda -->

      <div style="display:flex;gap:8px;margin-top:12px;">

  <!-- MODAL: crear/editar conjunto (drag & drop) -->
  <div class="p-modal-bg" id="outfitModalBg">
    <div class="p-modal">

      <label class="field-label">Nombre</label>

      <label class="field-label">Selecciona y ordena prendas (arrastra para reordenar)</label>

      <div style="display:flex;gap:8px;margin-top:12px;">

        <button class="cta-btn" id="saveOutfitBtn">Guardar conjunto</button>

    </div>
  </div>

  <!-- MODAL: settings (Export/Import) -->
  <div class="p-modal-bg" id="settingsModalBg">
    <div class="p-modal">
      <h3>Ajustes</h3>
      <label class="field-label">Usar IA</label>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">

      <div style="display:flex;gap:8px;margin-top:12px;">

      <div style="display:flex;gap:8px;margin-top:12px;">

        <option value="salir">Salir</option>

      </div>
    </div>
  </div>

</div>

<script>
/* percha: versión con Export/Import, editar prenda, drag&drop en conjuntos, infinite scroll */
(async function(){
  // --- state ---
  const PAGE_SIZE = 40;
  let garments = [], outfits = [], log = {};
  let visibleCount = PAGE_SIZE;
  let selectMode = false;
  const selectionSet = new Set();
  const imageObjectUrls = {};
  let useAi = false, aiApiKey = null;
  let currentFilter = 'todas';
  const CAT_LABELS = { top:'Parte de arriba', bottom:'Parte de abajo', dress:'Vestido / mono', outerwear:'Abrigo / chaqueta', shoes:'Calzado', accessory:'Accesorio', cap:'Gorras' };
  const STATUS_ORDER = ['disponible','lavando','no_quiero'];
  const STATUS_LABELS = { disponible:'Disponible', lavando:'Lavando', no_quiero:'No me la quiero poner' };

  // --- IndexedDB KV store (with migration; images saved as blobs under image:{id}) ---
  (function(){
    const DB_NAME='percha-db', DB_VERSION=1, STORE='kv';
    let dbP=null;
    function openDB(){ if(dbP) return dbP; dbP=new Promise((res,rej)=>{ const rq=indexedDB.open(DB_NAME,DB_VERSION); rq.onupgradeneeded=(e)=>{ const db=e.target.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'key'}); }; rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); return dbP; }
    async function idbGet(k){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const s=tx.objectStore(STORE); const r=s.get(k); r.onsuccess=()=>res(r.result? r.result.value:null); r.onerror=()=>rej(r.error); }); }
    async function idbSet(k,v){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); const s=tx.objectStore(STORE); const r=s.put({key:k,value:v}); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); }); }
    async function idbDelete(k){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); const s=tx.objectStore(STORE); const r=s.delete(k); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); }); }
    async function idbList(prefix){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const s=tx.objectStore(STORE); const out=[]; const rq=s.openCursor(); rq.onsuccess=(e)=>{ const cur=e.target.result; if(!cur){ res(out); return; } if(typeof cur.key==='string' && cur.key.indexOf(prefix)===0) out.push(cur.key); cur.continue(); }; rq.onerror=()=>rej(rq.error); }); }
    function dataUrlToBlob(d){ const m=d.match(/^data:(.+);base64,(.*)$/); if(!m) return null; const mime=m[1], b64=m[2]; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
    async function migrateLocalStorageToIndexedDB(){ try{ if(typeof localStorage==='undefined') return; const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && (k.indexOf('garment:')===0 || k.indexOf('outfit:')===0 || k==='outfit-log' || k==='ai-api-key' || k==='use-ai')) keys.push(k); } if(keys.length===0) return; for(const k of keys){ const v=localStorage.getItem(k); if(v===null) continue; try{ if(k.indexOf('garment:')===0){ const obj=JSON.parse(v); const id=obj.id||k.split(':')[1]; if(obj.image && typeof obj.image==='string' && obj.image.indexOf('data:')===0){ const blob=dataUrlToBlob(obj.image); if(blob) await idbSet('image:'+id, blob); delete obj.image; await idbSet(k, JSON.stringify(obj)); continue; } } await idbSet(k, v); }catch(e){ try{ await idbSet(k,v); }catch(e){} } } }catch(e){ console.warn('migration err', e); } }
    window.storage = {
      get: async (k)=> { try{return await idbGet(k);}catch(e){return null;} },
      set: async (k,v)=> { try{ await idbSet(k,v); }catch(e){} },
      delete: async (k)=> { try{ await idbDelete(k); }catch(e){} },
      list: async (p)=> { try{ return await idbList(p); }catch(e){ return []; } },
      _init: async ()=> { await openDB(); await migrateLocalStorageToIndexedDB(); }
    };
    openDB().then(()=>migrateLocalStorageToIndexedDB()).catch(()=>{/*silent*/});
  })();

  // --- helpers ---
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function blobToBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onloadend=()=>{ const m = r.result.match(/^data:(.+);base64,(.*)$/); res(m? { media_type:m[1], data:m[2] } : null); }; r.onerror=rej; r.readAsDataURL(blob); }); }

  // lazy image loader using IntersectionObserver
  let _observer = null;
  function initLazy(){ if(_observer) return; if(!('IntersectionObserver' in window)) return; _observer = new IntersectionObserver((entries)=>{ entries.forEach(en=>{ if(en.isIntersecting){ const img=en.target; const s=img.getAttribute('data-src'); if(s){ img.src=s; img.removeAttribute('data-src'); _observer.unobserve(img); } } }); }, { rootMargin:'200px' }); }
  function observeLazy(img){ initLazy(); if(img && img.getAttribute('data-src')) _observer.observe(img); }

  // storage wrappers
  async function storageGet(k){ try{ return await window.storage.get(k); }catch(e){ return null; } }
  async function storageSet(k,v){ try{ await window.storage.set(k,v); }catch(e){} }
  async function storageDelete(k){ try{ await window.storage.delete(k); }catch(e){} }
  async function storageList(p){ try{ return await window.storage.list(p); }catch(e){ return []; } }

  // load/save garments
  async function loadGarments(){ const keys = await storageList('garment:'); const out=[]; for(const k of keys){ try{ const raw = await storageGet(k); if(!raw) continue; const meta = typeof raw === 'string' ? JSON.parse(raw) : raw; const id = meta.id || k.split(':')[1]; const g = Object.assign({}, meta); g.id = id; const blob = await storageGet('image:'+id); if(blob && (blob instanceof Blob || Object.prototype.toString.call(blob)==='[object Blob]')){ const url = URL.createObjectURL(blob); imageObjectUrls[id]=url; g.image = url; } else g.image = meta.image || ''; out.push(g); }catch(e){} } out.sort((a,b)=> (a.addedAt||0) - (b.addedAt||0)); return out; }
  async function saveGarment(g){ const id=g.id; const meta=Object.assign({}, g); delete meta.image; delete meta._pendingDataUrl; await storageSet('garment:'+id, JSON.stringify(meta)); if(g._pendingDataUrl){ const blob=(function(d){ const m=d.match(/^data:(.+);base64,(.*)$/); if(!m) return null; const mime=m[1], b64=m[2]; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); })(g._pendingDataUrl); if(blob){ await storageSet('image:'+id, blob); if(imageObjectUrls[id]){ try{ URL.revokeObjectURL(imageObjectUrls[id]); }catch(e){} delete imageObjectUrls[id]; } imageObjectUrls[id] = URL.createObjectURL(blob); } delete g._pendingDataUrl; } }
  async function deleteGarmentStorage(id){ if(imageObjectUrls[id]){ try{ URL.revokeObjectURL(imageObjectUrls[id]); }catch(e){} delete imageObjectUrls[id]; } await storageDelete('garment:'+id); await storageDelete('image:'+id); }

  // load/save outfits
  async function loadOutfits(){ const keys = await storageList('outfit:'); const out = []; for(const k of keys){ try{ const raw = await storageGet(k); if(!raw) continue; out.push(typeof raw==='string' ? JSON.parse(raw) : raw); }catch(e){} } out.sort((a,b)=> (a.createdAt||0) - (b.createdAt||0)); return out; }
  async function saveOutfit(o){ await storageSet('outfit:'+o.id, JSON.stringify(o)); }
  async function deleteOutfitStorage(id){ await storageDelete('outfit:'+id); }

  // log helpers
  async function loadLog(){ const v = await storageGet('outfit-log'); if(!v) return {}; try{ return JSON.parse(v); }catch(e){ return {}; } }
  async function saveLog(){ await storageSet('outfit-log', JSON.stringify(log)); }

  // color bucket
  async function colorBucketFromDataUrl(dataUrl){
    return new Promise((resolve)=>{ try{ const img=new Image(); img.onload=()=>{ const w=40,h=40,c=document.createElement('canvas'); c.width=w;c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); try{ const d=ctx.getImageData(0,0,w,h).data; let r=0,g=0,b=0,cnt=0; for(let i=0;i<d.length;i+=4){ if(d[i+3]<120) continue; r+=d[i]; g+=d[i+1]; b+=d[i+2]; cnt++; } if(cnt===0) return resolve('grey'); r=Math.round(r/cnt); g=Math.round(g/cnt); b=Math.round(b/cnt); const rn=r/255, gn=g/255, bn=b/255; const max=Math.max(rn,gn,bn), min=Math.min(rn,gn,bn); const l=(max+min)/2; const dlt=max-min; let s=0,h=0; if(dlt!==0){ s=dlt/(1-Math.abs(2*l-1)); switch(max){ case rn: h=((gn-bn)/dlt)%6; break; case gn: h=(bn-rn)/dlt+2; break; case bn: h=(rn-gn)/dlt+4; break; } h=Math.round(h*60); if(h<0) h+=360; } if(l<0.12) return resolve('black'); if(l>0.88) return resolve('white'); if(s<0.12) return resolve('grey'); if(h>=0 && h<15) return resolve('red'); if(h>=15 && h<45) return resolve('orange'); if(h>=45 && h<65) return resolve('yellow'); if(h>=65 && h<170) return resolve('green'); if(h>=170 && h<260) return resolve('blue'); if(h>=260 && h<300) return resolve('purple'); return resolve('pink'); }catch(e){ resolve('grey'); } }; img.onerror=()=>resolve('grey'); img.src=dataUrl; }catch(e){ resolve('grey'); } }); }

  // lazy observe helper
  function observeLazyAll(){ document.querySelectorAll('img[data-src]').forEach(img=> observeLazy(img)); }

    if(currentFilter==='todas') return garments;
    if(currentFilter==='favoritos') return garments.filter(g=>g.favorite);
    return garments.filter(g=> g.status===currentFilter);
  }

    document.querySelectorAll('[data-edit]').forEach(btn=> btn.addEventListener('click', (e)=> openEditModal(e.currentTarget.getAttribute('data-edit')) ));
    document.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', async (e)=>{ const id=e.currentTarget.getAttribute('data-del'); if(!confirm('Eliminar prenda?')) return; garments = garments.filter(g=>g.id!==id); await deleteGarmentStorage(id); outfits = outfits.map(o=>({ ...o, garmentIds: o.garmentIds.filter(i=>garments.find(g2=>g2.id===i)) })).filter(o=>o.garmentIds.length>0); for(const o of outfits) await saveOutfit(o); renderArmario(); }));
    document.querySelectorAll('[data-cycle]').forEach(btn=> btn.addEventListener('click', async (e)=>{ const id=e.currentTarget.getAttribute('data-cycle'); const g=garments.find(x=>x.id===id); if(!g) return; const idx=STATUS_ORDER.indexOf(g.status); g.status = STATUS_ORDER[(idx+1)%STATUS_ORDER.length]; await saveGarment(g); await storageSet('garment:'+g.id, JSON.stringify(Object.assign({}, g, { image: undefined }))); renderArmario(); }));

  function renderOutfits(){
    const el = document.getElementById('outfitsSection');

    if(outfits.length===0){ el.innerHTML = newBtn + `<div style="margin-left:8px;color:var(--muted);">No hay conjuntos</div>`; } else {
      const listHtml = outfits.map(o=>{ const thumb = o.garmentIds && o.garmentIds.length ? (garments.find(g=>g.id===o.garmentIds[0])||{}).image : ''; return `<div class="outfit-card" data-id="${o.id}"><div class="outfit-thumb">${thumb? `<img data-src="${escapeHtml(thumb)}" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'></svg>" style="width:100%;height:100%;object-fit:cover;">` : ''}</div><div style="margin-left:8px"><div style="font-weight:700">${escapeHtml(o.name)}</div><div style="font-size:12px;color:var(--muted)">${o.garmentIds.length} prendas</div></div><div style="margin-left:auto;display:flex;flex-direction:column;gap:6px;"><button class="cta-btn" data-apply="${o.id}" style="padding:6px 8px;font-size:12px;">Aplicar</button><button class="secondary-btn" data-delete-outfit="${o.id}" style="padding:6px 8px;font-size:12px;">Eliminar</button></div></div>`; }).join('');
      el.innerHTML = newBtn + `<div style="display:flex;flex-direction:column;gap:10px;margin-left:8px;">${listHtml}</div>`;
      document.querySelectorAll('.outfit-thumb img[data-src]').forEach(img=> observeLazy(img));
    }
    document.getElementById('createOutfitBtn')?.addEventListener('click', ()=> openOutfitModal(''));
    el.querySelectorAll('[data-apply]').forEach(btn=> btn.addEventListener('click', async (e)=>{ const id=e.currentTarget.getAttribute('data-apply'); const o=outfits.find(x=>x.id===id); if(!o) return; const date=todayStr(); log[date]=Array.from(new Set([...(log[date]||[]), ...o.garmentIds])); await saveLog(); renderHistorial(); alert('Conjunto aplicado.'); }));
    el.querySelectorAll('[data-delete-outfit]').forEach(btn=> btn.addEventListener('click', async (e)=>{ const id=e.currentTarget.getAttribute('data-delete-outfit'); if(!confirm('Eliminar conjunto?')) return; outfits = outfits.filter(o=>o.id!==id); await deleteOutfitStorage(id); renderOutfits(); }));

  function renderHistorial(){
    const el=document.getElementById('historialList'); const days=[]; for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
    el.innerHTML = days.map(dateStr=>{ const ids = log[dateStr]||[]; const items = ids.map(id=>garments.find(g=>g.id===id)).filter(Boolean); return `<div style="margin-bottom:14px;"><div style="display:flex;justify-content:space-between;font-family:IBM Plex Mono,monospace;font-size:12px;color:var(--muted)">${dateStr===todayStr()?'Hoy · '+dateStr:dateStr}${items.length?` <button data-undo="${dateStr}" style="background:none;border:none;color:var(--accent);cursor:pointer">deshacer</button>`:''}</div>${items.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${items.map(g=>`<img src="${g.image||''}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;">`).join('')}</div>`:`<div style="margin-top:8px;color:var(--muted)">Sin registro</div>`}</div>`; }).join('');

  // selection UI
  function updateSelectionUI(){
    const selAct = document.getElementById('selectionActions');
    if(!selectMode){ selAct.style.display='none'; document.querySelectorAll('.tag-card input[type=checkbox].sel').forEach(cb=>cb.remove()); selectionSet.clear(); document.getElementById('backBtn').style.display = anyModalOpen()? 'inline-flex':'none'; return; }
    selAct.style.display='flex';
    selAct.innerHTML = `<div style="font-size:13px;color:var(--muted)">Seleccionadas: ${selectionSet.size}</div>
      <button class="secondary-btn" id="markLavandoBtn">Lavando</button>
      <button class="secondary-btn" id="markDisponibleBtn">Disponible</button>
      <button class="secondary-btn" id="markNoQuieroBtn">No usar</button>
      <button class="secondary-btn" id="createOutfitFromSelBtn">Crear conjunto</button>
      <button class="secondary-btn" id="deleteSelBtn" style="background:#FDEDEB;border-color:var(--accent);color:var(--accent)">Eliminar</button>
      <button class="secondary-btn" id="exitSelectBtn">Salir</button>`;
    // add checkbox inputs to each card
    document.querySelectorAll('.tag-card').forEach(tc=>{ const id=tc.getAttribute('data-id'); let cb=tc.querySelector('input.sel'); if(!cb){ cb=document.createElement('input'); cb.type='checkbox'; cb.className='sel'; cb.style.position='absolute'; cb.style.left='10px'; cb.style.top='10px'; tc.appendChild(cb); } cb.checked = selectionSet.has(id); cb.onchange = (e)=>{ if(e.target.checked) selectionSet.add(id); else selectionSet.delete(id); updateSelectionUI(); } });
    // actions
    document.getElementById('markLavandoBtn').onclick = async ()=>{ if(selectionSet.size===0) return alert('No hay prendas seleccionadas'); for(const id of Array.from(selectionSet)){ const g = garments.find(x=>x.id===id); if(g){ g.status='lavando'; await saveGarment(g); await storageSet('garment:'+g.id, JSON.stringify(Object.assign({}, g, { image: undefined }))); } } renderArmario(); };
    document.getElementById('markDisponibleBtn').onclick = async ()=>{ if(selectionSet.size===0) return alert('No hay prendas seleccionadas'); for(const id of Array.from(selectionSet)){ const g = garments.find(x=>x.id===id); if(g){ g.status='disponible'; await saveGarment(g); await storageSet('garment:'+g.id, JSON.stringify(Object.assign({}, g, { image: undefined }))); } } renderArmario(); };
    document.getElementById('markNoQuieroBtn').onclick = async ()=>{ if(selectionSet.size===0) return alert('No hay prendas seleccionadas'); for(const id of Array.from(selectionSet)){ const g = garments.find(x=>x.id===id); if(g){ g.status='no_quiero'; await saveGarment(g); await storageSet('garment:'+g.id, JSON.stringify(Object.assign({}, g, { image: undefined }))); } } renderArmario(); };
    document.getElementById('deleteSelBtn').onclick = async ()=>{ if(selectionSet.size===0) return alert('No hay prendas seleccionadas'); if(!confirm('Eliminar seleccionadas?')) return; for(const id of Array.from(selectionSet)){ garments = garments.filter(g=>g.id!==id); await deleteGarmentStorage(id); } outfits = outfits.map(o=>({ ...o, garmentIds: o.garmentIds.filter(i=>garments.find(g=>g.id===i)) })).filter(o=>o.garmentIds.length>0); for(const o of outfits) await saveOutfit(o); selectionSet.clear(); renderArmario(); };
    document.getElementById('createOutfitFromSelBtn').onclick = ()=>{ if(selectionSet.size===0) return alert('Selecciona prendas'); openOutfitModal(''); setTimeout(()=>{ document.querySelectorAll('#outfitGarmentList input[type=checkbox]').forEach(c=> c.checked = selectionSet.has(c.value)); },120); };
    document.getElementById('exitSelectBtn').onclick = ()=>{ selectMode=false; selectionSet.clear(); pushBackStateIfNeeded(false); renderArmario(); };
    document.getElementById('backBtn').style.display = 'inline-flex';
  }

  function pushBackStateIfNeeded(enter){ try{ if(enter){ history.pushState({percha:'sub'},''); document.getElementById('backBtn').style.display='inline-flex'; } else { if(history.state && history.state.percha==='sub') history.back(); document.getElementById('backBtn').style.display = anyModalOpen()? 'inline-flex':'none'; } }catch(e){} }
  window.addEventListener('popstate', (e)=>{ if(document.getElementById('modalBg').classList.contains('active')){ closeModal(); return; } if(document.getElementById('outfitModalBg').classList.contains('active')){ closeOutfitModal(); return; } if(document.getElementById('settingsModalBg').classList.contains('active')){ closeSettings(); return; } if(document.getElementById('occasionModalBg').classList.contains('active')){ closeOccModal(); return; } if(selectMode){ selectMode=false; selectionSet.clear(); renderArmario(); return; } });

  function openEditModal(id){ const g = garments.find(x=>x.id===id); if(!g) return; editingId = id; document.getElementById('modalTitle').textContent='Editar prenda'; document.getElementById('garmentName').value=g.name||''; document.getElementById('garmentCategory').value=g.category||'top'; document.getElementById('garmentOcc').value=g.occasion||'informal'; document.getElementById('garmentFavorite').checked=!!g.favorite; if(g.image){ document.getElementById('photoPreviewImg').src=g.image; document.getElementById('photoPreview').style.display='block'; document.getElementById('removeImageBtn').style.display='inline-block'; } else { document.getElementById('photoPreview').style.display='none'; document.getElementById('removeImageBtn').style.display='none'; } modalBg.classList.add('active'); pushBackStateIfNeeded(true); }

  async function handleFile(file){ if(!file) return; const data = await fileToCompressedDataUrl(file); document.getElementById('photoPreviewImg').src=data; document.getElementById('photoPreview').style.display='block'; document.getElementById('removeImageBtn').style.display='inline-block'; window._pendingImageDataUrl = data; }

  document.getElementById('saveGarment').addEventListener('click', async ()=>{
    const name = document.getElementById('garmentName').value.trim(); const category = document.getElementById('garmentCategory').value; const occasion = document.getElementById('garmentOcc').value; const favorite = !!document.getElementById('garmentFavorite').checked;
    if(!name) return alert('Ponle un nombre a la prenda.');
    if(editingId){
      const g = garments.find(x=>x.id===editingId);
      if(!g) return;
      g.name = name; g.category = category; g.occasion = occasion; g.favorite = favorite;
      if(window._pendingImageDataUrl === '__REMOVE__'){ await storageDelete('image:'+g.id); g.image=''; }
      else if(window._pendingImageDataUrl){ g._pendingDataUrl = window._pendingImageDataUrl; g.colorBucket = await colorBucketFromDataUrl(window._pendingImageDataUrl).catch(()=> g.colorBucket||'grey'); }
      await saveGarment(g);
      await storageSet('garment:'+g.id, JSON.stringify(Object.assign({}, g, { image: undefined })));
      delete window._pendingImageDataUrl;
      editingId = null;
      closeModal();
      garments = await loadGarments();
      renderArmario();
      return;
    }
    // create new
    if(!window._pendingImageDataUrl) return alert('Añade una foto de la prenda.');
    const id = (crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()));
    const g = { id, name, category, occasion, status:'disponible', favorite, addedAt:Date.now() };
    g.colorBucket = await colorBucketFromDataUrl(window._pendingImageDataUrl).catch(()=> 'grey');
    g._pendingDataUrl = window._pendingImageDataUrl;
    garments.push(g);
    await saveGarment(g);
    const blob = await storageGet('image:'+id);
    if(blob){ g.image = URL.createObjectURL(blob); imageObjectUrls[id]=g.image; }
    else g.image = '';
    await storageSet('garment:'+id, JSON.stringify(Object.assign({}, g, { image: undefined })));
    delete window._pendingImageDataUrl;
    closeModal();
    renderArmario();
  });

  // outfits modal with drag & drop
  const outfitModalBg = document.getElementById('outfitModalBg');
  let editingOutfitId = null;
  function openOutfitModal(editId){
    editingOutfitId = editId || null;
    document.getElementById('outfitName').value = '';
    const container = document.getElementById('outfitGarmentList');
    container.innerHTML = '';
    // list garments as draggable items with checkbox and drag handle
    for(const g of garments){
      const div = document.createElement('div');
      div.className = 'outfit-item';
      div.draggable = true;
      div.dataset.id = g.id;
      div.style.display='flex'; div.style.alignItems='center'; div.style.gap='8px'; div.style.padding='8px'; div.style.border='1px solid var(--canvas-deep)'; div.style.borderRadius='8px'; div.style.background='var(--card)';
      div.innerHTML = `<input type="checkbox" value="${g.id}"><img src="${g.image||''}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;"><div style="flex:1"><div style="font-weight:700">${escapeHtml(g.name)}</div><div style="font-size:12px;color:var(--muted)">${escapeHtml(CAT_LABELS[g.category]||g.category)}</div></div><div style="cursor:grab;padding:6px;color:var(--muted)">☰</div>`;
      // drag events
      div.addEventListener('dragstart', (e)=>{ e.dataTransfer.setData('text/plain', g.id); div.classList.add('dragging'); });
      div.addEventListener('dragend', (e)=>{ div.classList.remove('dragging'); });
      div.addEventListener('dragover', (e)=>{ e.preventDefault(); div.classList.add('dragover'); });
      div.addEventListener('dragleave', ()=> div.classList.remove('dragover'));
      div.addEventListener('drop', (e)=>{ e.preventDefault(); div.classList.remove('dragover'); const draggedId = e.dataTransfer.getData('text/plain'); if(!draggedId) return; // reorder DOM: insert dragged before this
        const draggedEl = Array.from(container.children).find(ch=>ch.dataset.id===draggedId); if(!draggedEl) return; container.insertBefore(draggedEl, div.nextSibling);
      });
      container.appendChild(div);
    }
    // if editing an outfit, pre-check and set name and order
    if(editingOutfitId){
      const o = outfits.find(x=>x.id===editingOutfitId);
      if(o){ document.getElementById('outfitName').value = o.name; // check items in order of outfit
        // reorder container to match o.garmentIds first
        const containerChildren = Array.from(container.children);
        o.garmentIds.slice().reverse().forEach(id=>{ const el = containerChildren.find(c=>c.dataset.id===id); if(el) container.insertBefore(el, container.firstChild); });
        // check those selected
        document.querySelectorAll('#outfitGarmentList input[type=checkbox]').forEach(cb=> cb.checked = o.garmentIds.includes(cb.value));
      }
    }
    outfitModalBg.classList.add('active');
    pushBackStateIfNeeded(true);
  }
  function closeOutfitModal(){ outfitModalBg.classList.remove('active'); editingOutfitId=null; document.getElementById('backBtn').style.display = (selectMode || anyModalOpen())? 'inline-flex':'none'; }
  document.getElementById('createOutfitBtnSmall').addEventListener('click', ()=> openOutfitModal(''));
  document.getElementById('cancelOutfit').addEventListener('click', closeOutfitModal);
  document.getElementById('saveOutfitBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('outfitName').value.trim();
    if(!name) return alert('Ponle un nombre al conjunto');
    const container = document.getElementById('outfitGarmentList');
    const chosen = Array.from(container.children).map(ch=>{ const cb = ch.querySelector('input[type=checkbox]'); return cb && cb.checked ? ch.dataset.id : null; }).filter(Boolean);
    if(chosen.length===0) return alert('Selecciona al menos una prenda');
    if(editingOutfitId){
      const idx = outfits.findIndex(o=>o.id===editingOutfitId);
      if(idx>=0){ outfits[idx].name = name; outfits[idx].garmentIds = chosen; await saveOutfit(outfits[idx]); }
    } else {
      const o = { id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())), name, garmentIds: chosen, createdAt: Date.now() };
      outfits.push(o); await saveOutfit(o);
    }
    closeOutfitModal(); renderOutfits();
  });

  // settings modal + export/import
  const settingsModalBg = document.getElementById('settingsModalBg');
  document.getElementById('settingsBtn').addEventListener('click', async ()=>{ document.getElementById('aiApiKey').value = aiApiKey || ''; document.getElementById('useAiChk').checked = !!useAi; settingsModalBg.classList.add('active'); pushBackStateIfNeeded(true); });
  function closeSettings(){ settingsModalBg.classList.remove('active'); document.getElementById('backBtn').style.display = (selectMode || anyModalOpen())? 'inline-flex':'none'; }
  document.getElementById('cancelSettings').addEventListener('click', closeSettings);
  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{ aiApiKey = document.getElementById('aiApiKey').value.trim() || null; useAi = !!document.getElementById('useAiChk').checked; await storageSet('ai-api-key', aiApiKey || ''); await storageSet('use-ai', useAi ? '1' : '0'); closeSettings(); alert('Ajustes guardados'); });

  // Export function: creates JSON with metadata and image dataURLs
  document.getElementById('exportBtn').addEventListener('click', async ()=>{
    const data = { garments: [], outfits, log };
    for(const g of garments){
      const meta = Object.assign({}, g); delete meta.image;
      const blob = await storageGet('image:'+g.id);
      if(blob){
        const b64 = await new Promise(res=>{ const r=new FileReader(); r.onloadend=()=>res(r.result); r.readAsDataURL(blob); });
        meta.imageDataUrl = b64;
      }
      data.garments.push(meta);
    }
    const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='percha-export.json'; a.click(); URL.revokeObjectURL(url);
  });

  // Import: file input -> parse, validate, store (merge)
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', async (e)=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    try{
      const text = await f.text(); const data = JSON.parse(text);
      if(!data || !Array.isArray(data.garments)) return alert('Archivo inválido');
      let imported=0, skipped=0;
      for(const meta of data.garments){
        // basic validation
        if(!meta.id || !meta.name) { skipped++; continue; }
        // if id exists, skip or create new id to avoid collision
        let id = meta.id;
        if(garments.find(g=>g.id===id) || (await storageGet('garment:'+id))) {
          // rename imported item to avoid collision
          id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()));
        }
        const g = Object.assign({}, meta);
        g.id = id;
        // if imageDataUrl, store as blob
        if(meta.imageDataUrl && typeof meta.imageDataUrl === 'string'){
          const m = meta.imageDataUrl.match(/^data:(.+);base64,(.*)$/);
          if(m){
            const mime = m[1], b64=m[2]; const bin = atob(b64); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); const blob = new Blob([arr], { type:mime });
            await storageSet('image:'+id, blob);
            g.image = URL.createObjectURL(blob);
            imageObjectUrls[id] = g.image;
          }
        } else { g.image = ''; }
        // ensure defaults
        g.status = g.status || 'disponible';
        g.favorite = !!g.favorite;
        g.addedAt = g.addedAt || Date.now();
        await storageSet('garment:'+id, JSON.stringify(Object.assign({}, g, { image: undefined })));
        garments.push(g);
        imported++;
      }
      // outfits and log import (merge)
      if(Array.isArray(data.outfits)){
        for(const o of data.outfits){
          const id = (crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()));
          const o2 = { id, name:o.name||'Importado', garmentIds: (o.garmentIds||[]).filter(i=> garments.find(g=>g.id===i)), createdAt:o.createdAt||Date.now() };
          outfits.push(o2); await saveOutfit(o2);
        }
      }
      if(data.log && typeof data.log === 'object'){ log = Object.assign({}, log, data.log); await saveLog(); }
      alert(`Importación completada. Importadas ${imported}, omitidas ${skipped}.`);
      renderArmario();
      renderOutfits();
    }catch(err){ console.error(err); alert('Error importando archivo'); }
    document.getElementById('importFile').value = '';
  });

  // occasion modal
  const occasionModalBg = document.getElementById('occasionModalBg');
  function openOccModal(){ occasionModalBg.classList.add('active'); pushBackStateIfNeeded(true); }
  function closeOccModal(){ occasionModalBg.classList.remove('active'); document.getElementById('backBtn').style.display = (selectMode || anyModalOpen())? 'inline-flex':'none'; }
  document.getElementById('cancelOcc').addEventListener('click', ()=> closeOccModal());
  document.getElementById('confirmOcc').addEventListener('click', ()=>{ const occ = document.getElementById('occasionSelect').value; closeOccModal(); requestSuggestion(occ); });

  // suggestion logic: local + optional AI (kept simple & similar to previous)
  function wornThisWeekIds(){ const ids=new Set(); Object.keys(log).forEach(date=>{ const d=new Date(date+'T12:00:00'); const monday=(d0=>{ d0=new Date(d0); const day=d0.getDay(); const diff=(day===0?-6:1-day); d0.setDate(d0.getDate()+diff); d0.setHours(0,0,0,0); return d0; })(new Date()); const sunday=new Date(monday); sunday.setDate(monday.getDate()+6); if(d>=monday && d<=sunday) (log[date]||[]).forEach(id=>ids.add(id)); }); return ids; }
  function daysSinceWorn(id){ const dates = Object.keys(log).filter(d=> (log[d]||[]).includes(id)); if(dates.length===0) return 9999; const last = dates.sort().reverse()[0]; return Math.floor((new Date() - new Date(last+'T12:00:00'))/(1000*60*60*24)); }
  function colorCompatibilityScore(a,b){ if(!a||!b) return 0; const neutral = ['grey','black','white','brown']; if(a.colorBucket===b.colorBucket) return 3; if(neutral.includes(a.colorBucket) || neutral.includes(b.colorBucket)) return 2; const sim = { red:['orange','pink'], orange:['red','brown','yellow'], yellow:['orange','green'], green:['blue','yellow'], blue:['green','purple'], purple:['blue','pink'], pink:['red','purple'] }; if(sim[a.colorBucket] && sim[a.colorBucket].includes(b.colorBucket)) return 2; return 0; }

  async function localSuggest(occasion, avoidCombo){
    const resultEl = document.getElementById('suggestionResult');
    const candidatesAll = garments.filter(g=> g.status==='disponible');
    const worn = wornThisWeekIds();
    const candidates = candidatesAll.filter(g=> !worn.has(g.id));
    if(candidates.length===0){ resultEl.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7h18v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" stroke-width="1.4"/></svg><div>No hay prendas disponibles sin usar esta semana.</div></div>`; return; }
    const pref = {
      informal: ['top','bottom','shoes','cap','accessory'],
      elegante: ['top','bottom','outerwear','shoes','accessory'],
      noche: ['top','bottom','shoes','outerwear','accessory'],
      trabajo: ['top','bottom','outerwear','shoes'],
      deporte: ['shoes','top','bottom'],
      evento: ['top','bottom','outerwear','shoes','accessory'],
      salir: ['top','bottom','shoes','accessory']
    }[occasion] || ['top','bottom','shoes','accessory'];
    const favBoost = 2.2;
    let chosen = [];
    const dresses = candidates.filter(c=>c.category==='dress');
    if(dresses.length>0){
      dresses.sort((a,b)=> ((b.favorite?favBoost:1)*(b.occasion===occasion?1.3:1)*daysSinceWorn(b.id)) - ((a.favorite?favBoost:1)*(a.occasion===occasion?1.3:1)*daysSinceWorn(a.id)));
      chosen.push(dresses[0]);
      const shoe = candidates.filter(c=>c.category==='shoes').sort((a,b)=> (b.favorite?favBoost:1)*daysSinceWorn(b.id) - (a.favorite?favBoost:1)*daysSinceWorn(a.id))[0];
      if(shoe) chosen.push(shoe);
    } else {
      const tops = candidates.filter(c=>c.category==='top');
      const bottoms = candidates.filter(c=>c.category==='bottom');
      const shoes = candidates.filter(c=>c.category==='shoes');
      let bestPair=null, bestScore=-999;
      for(const t of tops) for(const b of bottoms){
        let score = colorCompatibilityScore(t,b)*3;
        if(t.favorite) score += favBoost; if(b.favorite) score += favBoost;
        score += Math.min(14, daysSinceWorn(t.id))/14 + Math.min(14, daysSinceWorn(b.id))/14;
        if(t.occasion === occasion) score += 1.2;
        if(b.occasion === occasion) score += 1.2;
        score += (pref.indexOf(t.category)>=0?0.6:0) + (pref.indexOf(b.category)>=0?0.6:0);
        if(score>bestScore){ bestScore=score; bestPair=[t,b]; }
      }
      if(bestPair) chosen.push(...bestPair);
      if(chosen.length<2 && tops.length) chosen.push(tops.sort((a,b)=> (b.favorite?favBoost:1)*daysSinceWorn(b.id) - (a.favorite?favBoost:1)*daysSinceWorn(a.id))[0]);
      if(chosen.length<2 && bottoms.length) chosen.push(bottoms.sort((a,b)=> (b.favorite?favBoost:1)*daysSinceWorn(b.id) - (a.favorite?favBoost:1)*daysSinceWorn(a.id))[0]);
      if(chosen.length<3 && shoes.length) chosen.push(shoes.sort((a,b)=> (b.favorite?favBoost:1)*daysSinceWorn(b.id) - (a.favorite?favBoost:1)*daysSinceWorn(a.id))[0]);
      if((occasion==='informal' || occasion==='noche' || occasion==='salir') && candidates.some(c=>c.category==='cap')){ const caps = candidates.filter(c=>c.category==='cap').sort((a,b)=> (b.favorite?favBoost:1)*daysSinceWorn(b.id) - (a.favorite?favBoost:1)*daysSinceWorn(a.id)); if(caps.length) chosen.push(caps[0]); }
    }
    chosen = Array.from(new Set(chosen.filter(Boolean)));
    if(chosen.length===0) chosen.push(candidates[0]);
    lastCandidates = candidatesAll;
    const chosenIndices = chosen.map(ci=> lastCandidates.indexOf(ci)+1).filter(n=>n>0);
    const reasoning = `Sugerencia local para "${occasion}": prioricé prendas marcadas para esa ocasión, favoritas y que no usaste recientemente. Seleccionadas: ${chosen.map(x=>x.name).join(', ')}.`;
    renderSuggestion({ chosen: chosenIndices, reasoning, source:'local' });
  }

  async function requestSuggestion(occasion, avoidCombo){
    const resultEl = document.getElementById('suggestionResult');
    const allCandidates = garments.filter(g=> g.status==='disponible');
    if(allCandidates.length===0){ resultEl.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2 4 4 .5-3 3 .7 4L12 13l-3.7 1.5.7-4-3-3L10 6z" stroke-width="1.4"/></svg><div>No hay prendas disponibles</div></div>`; return; }
    document.getElementById('suggestBtn').disabled=true; document.getElementById('suggestionResult').innerHTML = `<div style="padding:18px;text-align:center"><div style="width:36px;height:36px;border:3px dashed #CBB09C;border-radius:50%;margin:0 auto 10px;animation:spin 1.2s linear infinite"></div><div style="color:var(--muted)">Pensando en tu look…</div></div>`;
    if(!useAi || !aiApiKey){ await localSuggest(occasion, avoidCombo); document.getElementById('suggestBtn').disabled=false; return; }
    // AI path (limited attachments)
    const content = [{ type:'text', text: `Eres estilista. Busco un outfit para: ${occasion}. Elige prendas entre las siguientes:` }];
    const maxAttach=8;
    for(let i=0;i<Math.min(allCandidates.length,maxAttach); i++){
      const g = allCandidates[i];
      content.push({ type:'text', text:`Prenda ${i+1}: categoría "${CAT_LABELS[g.category]||g.category}", nombre "${g.name}", favorito: ${g.favorite? 'sí':'no'}.` });
      try{ let payload=null; if(g.image && g.image.indexOf('data:')===0) payload = (function(d){ const m=d.match(/^data:(.+);base64,(.*)$/); return m? { media_type:m[1], data:m[2] } : null; })(g.image); else if(g.image){ const r=await fetch(g.image); const blob=await r.blob(); payload = await blobToBase64(blob); } if(payload) content.push({ type:'image', source:{ type:'base64', media_type: payload.media_type, data: payload.data } }); }catch(e){}
    }
    content.push({ type:'text', text: 'Responde SOLO con JSON: {"chosen":[números], "reasoning":"explicación en español"}' });
    try{
      const resp = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'Content-Type':'application/json', 'x-api-key': aiApiKey }, body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:800, messages:[{ role:'user', content: content }] }) });
      if(!resp.ok) throw new Error('AI error'); const data = await resp.json(); const text = (data.content||[]).map(b=>b.text||'').join(''); const clean = text.replace(/```json|```/g,'').trim(); const parsed = JSON.parse(clean); parsed.source='ai'; lastCandidates = allCandidates; renderSuggestion(parsed);
    }catch(err){ console.warn('AI fail', err); await localSuggest(occasion, avoidCombo); } finally{ document.getElementById('suggestBtn').disabled=false; }
  }

  function renderSuggestion(parsed){
    const resultEl = document.getElementById('suggestionResult');
    const chosenGarments = (parsed.chosen||[]).map(n=> lastCandidates[n-1]).filter(Boolean);
    if(chosenGarments.length===0){ resultEl.innerHTML = `<div class="empty-state">No se generó una combinación</div>`; return; }
    const sourceLabel = parsed.source==='ai' ? 'Fuente: IA' : 'Fuente: local';
    resultEl.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">${escapeHtml(sourceLabel)}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px">${chosenGarments.map(g=>`<div style="background:var(--card);border-radius:10px;padding:8px;text-align:center;"><img src="${g.image||''}" style="width:100%;height:100px;object-fit:cover;border-radius:8px;"><div style="font-weight:700;margin-top:8px">${escapeHtml(g.name)}</div><div style="font-size:12px;color:var(--muted)">${escapeHtml(CAT_LABELS[g.category]||g.category)}</div></div>`).join('')}</div>
      <div class="reasoning-box">${escapeHtml(parsed.reasoning||'')}</div>
      <div style="display:flex;gap:8px;margin-top:12px;"><button class="cta-btn" id="logOutfitBtn">Me lo pongo hoy</button><button class="secondary-btn" id="retryBtn">Probar otra</button></div>`;
    document.getElementById('logOutfitBtn').addEventListener('click', async ()=>{ const date = todayStr(); const ids = chosenGarments.map(g=>g.id); log[date] = Array.from(new Set([...(log[date]||[]), ...ids])); await saveLog(); renderHistorial(); resultEl.innerHTML = `<div class="reasoning-box">Registrado en tu historial. ¡Listo!</div>`; });
    document.getElementById('retryBtn').addEventListener('click', ()=> requestSuggestion(document.getElementById('occasionSelect')?.value || 'informal', parsed.chosen));
  }

  // infinite scroll sentinel observer
  function setupInfiniteScroll(){
    const sentinel = document.getElementById('scrollSentinel');
    if(!('IntersectionObserver' in window) || !sentinel) return;
    const obs = new IntersectionObserver((entries)=>{ entries.forEach(en=>{ if(en.isIntersecting){ const total = getFilteredGarments().length; if(visibleCount < total){ visibleCount += PAGE_SIZE; renderArmario(); } } }); }, { root: null, rootMargin: '200px', threshold: 0.01 });
    obs.observe(sentinel);
  }

  // export/import functions already defined above

  // utility: compress file to dataURL
  function fileToCompressedDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const maxW=640; const scale=Math.min(1, maxW/img.width); const w=Math.round(img.width*scale), h=Math.round(img.height*scale); const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.75)); }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

  // init: storage + load
  await (window.storage && window.storage._init ? window.storage._init() : Promise.resolve());
  // load settings
  const k = await storageGet('ai-api-key'); aiApiKey = k || null; const u = await storageGet('use-ai'); useAi = (u === '1');
  garments = await loadGarments();
  outfits = await loadOutfits();
  log = await loadLog();
  garments.forEach(g=>{ if(imageObjectUrls[g.id]) g.image = imageObjectUrls[g.id]; else if(!g.image) g.image=''; });
  visibleCount = PAGE_SIZE;
  renderArmario();
  renderOutfits();
  renderHistorial();
  observeLazyAll();
  setupInfiniteScroll();

  // wiring: tabs, filters, selection, buttons
  document.querySelectorAll('.p-tab').forEach(tab=> tab.addEventListener('click', ()=>{ document.querySelectorAll('.p-tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.p-view').forEach(v=>v.classList.remove('active')); tab.classList.add('active'); document.getElementById('view-'+tab.getAttribute('data-tab')).classList.add('active'); }));
  document.getElementById('filterRow').addEventListener('click', (e)=>{ const btn = e.target.closest('.filter-chip'); if(!btn) return; document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.getAttribute('data-filter'); visibleCount = PAGE_SIZE; renderArmario(); });
  document.getElementById('selectModeBtn').addEventListener('click', ()=>{ selectMode = !selectMode; if(selectMode) pushBackStateIfNeeded(true); else selectionSet.clear(); updateSelectionUI(); renderArmario(); });
  document.getElementById('createOutfitBtnSmall').addEventListener('click', ()=> openOutfitModal(''));
  document.getElementById('suggestBtn').addEventListener('click', ()=> openOccModal());

  // NOTE: you can add more actions (editing, export import already wired)
  // Done.

})();
</script>
