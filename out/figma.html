<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Percha</title><style>:root{--bg:#faf7f3;--paper:#fffdfb;--ink:#34261e;--muted:#877b73;--line:#e9e1da;--purple:#8061b4;--soft:#f0e9f8;--gold:#d8b85d}*{box-sizing:border-box}body{margin:0;background:#252321;color:var(--ink);font-family:Arial,sans-serif}.phone{width:min(100vw,390px);height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}.screen{height:100%;overflow:auto;padding:32px 18px 92px;display:none}.screen.active{display:block}.header{height:48px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:7px;font-family:Georgia,serif;font-weight:700;font-size:17px}.mark{width:24px;height:24px;border:1px solid var(--gold);border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--purple);font-size:12px}.ai{font-size:7px;color:var(--purple);background:var(--soft);border:1px solid #ddd0ef;border-radius:9px;padding:4px 7px;font-weight:700}.back{border:0;background:none;font-size:28px;color:var(--ink)}h1,h2,h3{font-family:Georgia,serif}h1{font-size:29px;line-height:30px;margin:16px 0 7px}h2{font-size:21px;margin:10px 0 3px}p{font-size:10px;line-height:15px;color:var(--muted)}.photo{background-size:cover;background-position:center;border-radius:11px}.hero{height:190px;background-image:url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=900&q=80');position:relative}.hero:after{content:'✦ AI Wardrobe Curator';position:absolute;left:10px;bottom:10px;background:#fffdfbd9;border-radius:20px;padding:5px 9px;font-size:7px}.btn{width:100%;height:40px;border:0;border-radius:9px;background:var(--purple);color:white;font-weight:700;font-size:9px;margin-top:9px}.btn.ghost{background:var(--paper);color:var(--purple);border:1px solid #ddd1eb}.stats{border-top:1px solid var(--line);margin-top:13px;padding-top:9px;text-align:center;font-size:7px;color:var(--muted)}.stats b{color:var(--ink);margin-right:3px}.stats i{display:inline-block;width:3px;height:3px;border-radius:50%;background:#d9c9e9;margin:0 8px}.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:#fffdfbf7;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 10px}.nav button{border:0;background:none;color:#8b817b;font-size:7px;display:flex;flex-direction:column;gap:3px;align-items:center}.nav button.active{color:var(--purple)}.icon{font-size:17px}.cabinet{width:180px;height:300px;margin:30px auto 45px;display:flex;position:relative;filter:drop-shadow(0 14px 15px #604b7022)}.door{width:50%;background:#d8c7eb;border:1px solid #c7b2df}.door:first-child{border-radius:6px 0 0 6px}.door:last-child{border-radius:0 6px 6px 0}.handle{position:absolute;top:48%;width:5px;height:28px;border-radius:4px;background:#f4d65c}.h1{left:calc(50% - 10px)}.h2{right:calc(50% - 10px)}.hint{text-align:center;color:var(--purple);font-size:8px}.chips{display:flex;gap:5px;overflow:auto;margin:5px 0 10px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 8px;font-size:7px}.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}.card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:6px}.ward{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}.ward:last-child{border:0}.thumb{width:55px;height:48px}.ward small,.history small{display:block;font-size:6px;color:var(--muted);text-transform:uppercase}.ward b{font:13px Georgia,serif}.pill{background:var(--soft);color:#765c91;border-radius:99px;padding:4px 6px;font-size:6px}.fab{position:absolute;right:17px;bottom:88px;width:40px;height:40px;border:0;border-radius:50%;background:var(--purple);color:#fff;font-size:22px}.search{height:32px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px;font-size:8px;color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.cat{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px}.cat .photo{height:55px;margin-bottom:5px}.cat b{font:12px Georgia,serif;display:block}.cat small{font-size:6px;color:var(--muted)}.detail-photo{height:260px}.brandline{font-size:7px;color:var(--muted);margin-top:9px}.detail h2{font-size:21px}.metrics{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;margin:12px 0;padding:9px}.metrics span{font-size:6px;color:var(--muted)}.metrics span+span{border-left:1px solid var(--line);padding-left:9px}.metrics b{display:block;color:var(--ink);font:14px Georgia,serif;margin-top:3px}.upload{height:115px;border:1px dashed #c9b8dd;background:var(--soft);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--purple);font-size:8px}.notice{margin:9px 0;background:var(--soft);border-radius:8px;padding:8px;font-size:7px;color:#755d8f}label{font-size:7px;font-weight:700;display:block;margin:9px 0}input{width:100%;height:31px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:0 8px;font-size:8px;margin-top:4px}.occasion{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:7px 0 12px}.occasion button,.seg button{height:45px;border:1px solid #ded2ec;background:var(--soft);border-radius:9px;color:var(--purple);font-size:8px}.weather{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px;font-size:8px}.weather b{margin-left:auto;font:16px Georgia,serif}.weather small{display:block;color:var(--muted);font-size:6px}.seg{display:flex;gap:4px}.seg button{flex:1;height:30px;background:var(--paper)}.seg .on{background:var(--soft)}.result{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:var(--soft);padding:8px;border-radius:10px}.result .photo{height:125px}.labels{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}.labels span{border:1px solid var(--line);border-radius:7px;padding:6px;font-size:6px;color:var(--muted)}.labels b{display:block;color:var(--ink);font:9px Georgia,serif;margin-top:2px}.edit{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px;margin:7px 0}.edit>div{display:grid;grid-template-columns:46px 1fr auto;gap:7px;align-items:center;margin-top:5px}.edit .photo{height:40px}.edit small{font-size:6px;color:var(--muted)}.saved{display:grid;grid-template-columns:1fr 1fr;gap:7px}.saved .wide{grid-column:1/3}.saved .photo{height:105px}.saved b{font:10px Georgia,serif}.saved small{font-size:6px;color:var(--muted)}.history{display:grid;grid-template-columns:48px 1fr auto;gap:7px;align-items:center;border:1px solid var(--line);background:var(--paper);padding:6px;border-radius:8px;margin:6px 0}.history .photo{height:42px}.profile{display:flex;gap:9px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:9px;border-radius:9px}.profile .avatar{width:38px;height:38px;border-radius:50%;background:url('https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=100&q=70') center/cover}.setting{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 3px;font-size:8px}.setting span{color:var(--muted)}h4{font-size:7px;color:var(--muted);margin:15px 0 6px}.month{display:flex;justify-content:space-between;font-size:8px;margin:8px 0}.month span{color:var(--purple)}.days{display:flex;justify-content:space-between;background:var(--paper);padding:8px;border-radius:8px;font-size:7px}.days:first-letter{background:var(--purple);color:#fff}</style></head><body><div class="phone" id="app"></div><script>
const I={closet:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=900&q=80',blazer:'https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=700&q=80',shirt:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80',dress:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=600&q=80',jeans:'https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=600&q=80',shoes:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80',bag:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80'};
const screens={inicio:`<div class="screen active" id="inicio"><header class="header"><div class="brand"><span class="mark">◉</span>Percha</div><span class="ai">✦ AI ASSIST</span></header><div class="photo hero"></div><h1>Tu armario<br>inteligente</h1><p>Organiza tus prendas, redescubre tu estilo y genera los outfits perfectos para cada ocasión con nuestro asistente de moda virtual.</p><button class="btn" onclick="go('armario')">Abrir mi armario →</button><button class="btn ghost" onclick="go('generador')">✦ ¿Qué me pongo hoy?</button><div class="stats"><b>142</b> Prendas listas<i></i><b>24</b> Outfits creados</div></div>`,armario:`<div class="screen active" id="armario"><header class="header"><div class="brand"><span class="mark">◉</span>Mi Armario</div><span class="ai">✦ AI ASSIST</span></header><div style="text-align:center;font-size:7px;color:#877b73">OTOÑO / INVIERNO</div><div class="cabinet" onclick="go('abierto')"><div class="door"></div><div class="door"></div><span class="handle h1"></span><span class="handle h2"></span></div><div class="hint">✦ Toca para abrir<br><small>Explora tus prendas organizadas por categorías</small></div></div>`,abierto:`<div class="screen active" id="abierto"><header class="header"><div class="brand"><span class="mark">◉</span>Mi Armario</div><span class="ai">✦ AI ASSIST</span></header><div class="chips"><span class="chip">Informal</span><span class="chip">Salir</span><span class="chip on">Elegante</span><span class="chip">Noche</span><span class="chip">Trabajo</span></div><div class="card">${ward(I.blazer,'BALDA SUPERIOR','Abrigos','8 prendas')}${ward(I.shirt,'BARRA SUPERIOR','Parte de arriba','32 prendas')}${ward(I.dress,'BARRA MEDIA','Vestidos y Enteros','12 prendas')}${ward(I.jeans,'CAJÓN PRINCIPAL','Parte de abajo','24 prendas')}${ward(I.bag,'CAJÓN PEQUEÑO','Gorras y accesorios','15 prendas')}${ward(I.shoes,'ZONA INFERIOR','Calzado','18 pares')}</div><button class="fab" onclick="go('anadir')">+</button></div>`,categorias:`<div class="screen active" id="categorias"><header class="header"><div class="brand"><span class="mark">◉</span>Categorías</div><span class="ai">✦ AI ASSIST</span></header><small>MI ARMARIO</small><div class="search">⌕&nbsp; Buscar prendas...</div><div class="grid">${cat(I.shirt,'Tops','32 prendas')}${cat(I.dress,'Vestidos','12 prendas')}${cat(I.jeans,'Pantalones','18 prendas')}${cat(I.dress,'Faldas','8 prendas')}${cat(I.blazer,'Abrigos','9 prendas')}${cat(I.shoes,'Zapatos','18 pares')}${cat(I.bag,'Bolsos','6 prendas')}${cat(I.bag,'Accesorios','15 prendas')}</div></div>`,detalle:`<div class="screen active" id="detalle"><header class="header"><button class="back" onclick="go('categorias')">‹</button><b>DETALLE DE PRENDA</b><span class="ai">✦ AI</span></header><div class="photo detail-photo" style="background-image:url('${I.blazer}')"></div><div class="brandline">ZARA STUDIO</div><h2>Blazer Oversize Camel</h2><div class="chips"><span class="chip">● Camel</span><span class="chip">Talla M</span><span class="chip">🍂 Otoño / Invierno</span></div><h4>OCASIONES RECOMENDADAS</h4><div class="chips"><span class="chip on">✦ Elegante</span><span class="chip on">Trabajo</span></div><div class="metrics"><span>Puesta<b>14 veces</b></span><span>Última puesta<b>Hace 3 días</b></span></div><button class="btn" onclick="go('generador')">✦ Generar Outfit con esta prenda</button></div>`,anadir:`<div class="screen active" id="anadir"><header class="header"><div class="brand"><span class="mark">◉</span>Añadir Prenda</div><span class="ai">✦ AI ASSIST</span></header><div class="upload">◎<br><b>Sube o toma una foto</b><br><small>Soporta JPG, PNG en fondo claro</small></div><div class="notice">✦ La IA detectará automáticamente tipo, color y estilo de tu prenda al subir la imagen.</div><label>Nombre de la Prenda<input value="Jersey de Punto Cuello V" readonly></label><label>Tipo de Prenda<input value="Tops" readonly></label><label>Talla<input value="M" readonly></label><label>Ocasiones recomendadas<div class="chips"><span class="chip">Informal</span><span class="chip">Salir</span><span class="chip on">Elegante</span><span class="chip on">Trabajo</span></div></label><button class="btn" onclick="go('abierto')">Guardar Prenda</button></div>`,generador:`<div class="screen active" id="generador"><header class="header"><div class="brand"><span class="mark">◉</span>Generador AI</div><span class="ai">✦ AI ASSIST</span></header><h4>¿PARA QUÉ OCASIÓN?</h4><div class="occasion"><button>Casual</button><button>Trabajo</button><button>Cita</button><button>Eventos</button><button>Deporte</button></div><h4>CLIMA ACTUAL</h4><div class="weather">☁️ <span>Ligeramente frío<small>Gran Canaria, Otoño</small></span><b>16°C</b></div><h4>PREFERENCIA DE ESTILO</h4><div class="seg"><button class="on">Minimalista</button><button>Atrevido</button><button>Clásico</button></div><button class="btn" onclick="go('resultado')">✦ Generar Outfit Inteligente ✨</button><p style="text-align:center">Basado en tus 142 prendas y tus preferencias.</p></div>`,resultado:`<div class="screen active" id="resultado"><header class="header"><button class="back" onclick="go('generador')">‹</button><b>TU OUTFIT AI</b><span class="pill">94% Match</span></header><div class="result"><div class="photo" style="background-image:url('${I.blazer}')"></div><div class="photo" style="background-image:url('${I.shirt}')"></div><div class="photo" style="background-image:url('${I.jeans}')"></div><div class="photo" style="background-image:url('${I.shoes}')"></div></div><div class="labels"><span>ABRIGO<b>Blazer Camel</b></span><span>PARTE SUPERIOR<b>Blusa Seda</b></span><span>PARTE INFERIOR<b>Pantalón Pinzas</b></span><span>CALZADO<b>Loafers Piel</b></span></div><button class="btn" onclick="go('editor')">Guardar este look</button></div>`,editor:`<div class="screen active" id="editor"><header class="header"><button class="back" onclick="go('resultado')">‹</button><b>EDITAR OUTFIT</b><span style="color:var(--purple);font-size:8px">Reset</span></header>${edit(I.shirt,'Parte Superior','Blusa Seda')}${edit(I.jeans,'Parte Inferior','Pantalón Pinzas')}${edit(I.shoes,'Calzado','Loafers Piel')}<button class="btn" onclick="go('outfits')">Confirmar Cambios</button></div>`,outfits:`<div class="screen active" id="outfits"><header class="header"><div class="brand"><span class="mark">◉</span>Mis Outfits</div><span class="pill">24 Guardados</span></header><div class="chips"><span class="chip on">Todos</span><span class="chip">Favoritos</span><span class="chip">Recientes</span></div><div class="saved"><div class="wide"><div class="photo" style="height:170px;background-image:url('${I.blazer}')"></div><b>Look Oficina Lunes</b><small>Trabajo · 92% match</small></div><div><div class="photo" style="height:100px;background-image:url('${I.dress}')"></div><b>Cita Romántica</b><small>Salir · 88%</small></div><div><div class="photo" style="height:100px;background-image:url('${I.bag}')"></div><b>Domingo Brunch</b><small>Informal · 91%</small></div></div></div>`,historial:`<div class="screen active" id="historial"><header class="header"><div class="brand"><span class="mark">◉</span>Historial</div><span class="ai">✦ AI ASSIST</span></header><div class="month"><b>Noviembre 2026</b><span>Ver mes completo</span></div><div class="days">12&nbsp;&nbsp;13&nbsp;&nbsp;14&nbsp;&nbsp;15&nbsp;&nbsp;16&nbsp;&nbsp;17&nbsp;&nbsp;18</div><h4>RECIENTEMENTE USADOS</h4>${hist(I.blazer,'Blazer Camel + Vaqueros','Hoy, 10:45 AM')}${hist(I.dress,'Vestido Midi Negro','Ayer, 19:20 PM')}${hist(I.shirt,'Vestido Flores','Hace 2 días')}</div>`,ajustes:`<div class="screen active" id="ajustes"><header class="header"><div class="brand"><span class="mark">◉</span>Ajustes</div><span class="ai">✦ AI ASSIST</span></header><div class="profile"><div class="avatar"></div><span><b>Sofía Valdés</b><small>sofia.valdes@example.com</small></span></div><h4>MI CUENTA</h4>${setting('Información Personal')}${setting('Suscripción Premium')}${setting('Preferencias de Estilo')}<h4>HERRAMIENTAS</h4>${setting('Ajustar mi Asistente AI')}${setting('Exportar Datos de Armario')}<h4>SOPORTE</h4>${setting('Ayuda y Soporte')}</div>`};
function ward(i,k,n,c){return `<button class="ward" onclick="go('categorias')"><div class="photo thumb" style="background-image:url('${i}')"></div><div><small>${k}</small><b>${n}</b></div><span class="pill">${c}</span></button>`}function cat(i,n,c){return `<button class="cat" onclick="go('detalle')"><div class="photo" style="background-image:url('${i}')"></div><b>${n}</b><small>${c}</small></button>`}function edit(i,k,n){return `<div class="edit"><b>${k}</b><div><div class="photo" style="background-image:url('${i}')"></div><span><b>${n}</b><small>Actual</small></span>↻</div><small>ALTERNATIVAS EN TU ARMARIO</small></div>`}function hist(i,n,t){return `<div class="history"><div class="photo" style="background-image:url('${i}')"></div><span><b>${n}</b><small>${t}</small></span><span class="pill">Trabajo</span></div>`}function setting(x){return `<div class="setting">${x}<span>›</span></div>`}
function nav(s){return `<div class="nav"><button class="${s==='inicio'?'active':''}" onclick="go('inicio')"><span class="icon">⌂</span>Inicio</button><button class="${['armario','abierto','categorias','detalle','anadir'].includes(s)?'active':''}" onclick="go('armario')"><span class="icon">♧</span>Armario</button><button class="${['outfits','resultado','editor'].includes(s)?'active':''}" onclick="go('outfits')"><span class="icon">♢</span>Outfits</button><button class="${s==='ajustes'?'active':''}" onclick="go('ajustes')"><span class="icon">⚙</span>Ajustes</button></div>`}
let current='inicio';function go(s){current=s;render()}function render(){document.getElementById('app').innerHTML=screens[current]+(current!=='ajustes'?nav(current):'')}render();</script></body></html>
